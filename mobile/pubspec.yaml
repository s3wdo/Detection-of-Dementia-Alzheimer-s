name: neurosense
description: NeuroSense mobile app — AI-assisted MRI analysis (final-year project).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

# Dependencies are added with `flutter pub add` so we get the latest stable
# versions; exact versions are locked in pubspec.lock.
dependencies:
  dio: ^5.11.1
  # Doctors pick full MRI scans (.nii / .nii.gz) with the system file browser.
  file_picker: 13.3.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  image_picker: ^1.2.3
  intl: ^0.20.3
  share_plus: 13.3.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Bundled open-source fonts (SIL Open Font License, see assets/fonts/OFL-*.txt).
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
