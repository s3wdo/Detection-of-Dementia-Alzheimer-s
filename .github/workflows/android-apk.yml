# Builds an Android .apk of the demo app for installing directly on a phone.
# It is signed with Flutter's debug key: fine for testing, not for Google Play.
#
# Run it from GitHub: Actions → "Android build (.apk)" → Run workflow (once this file is
# on the default branch), or push a tag like apk-2026-11-24 from any branch: a tag build
# uses the local server address below.
# Download: open the finished run → Artifacts → NeuroSense-apk.
name: Android build (.apk)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Server address, e.g. http://192.168.1.178:8000/api/v1. Empty = demo data build.'
        required: false
        default: ''
  push:
    tags: ['apk-*']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get

      # With a server address the app talks to that server; without one it is the demo-data build.
      - name: Build Android app
        env:
          API_BASE_URL: ${{ github.event_name == 'push' && 'http://192.168.1.178:8000/api/v1' || inputs.api_base_url }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            flutter build apk --release --dart-define=USE_FIXTURES=false --dart-define=API_BASE_URL="$API_BASE_URL"
          else
            flutter build apk --release --dart-define=USE_FIXTURES=true
          fi
          cp build/app/outputs/flutter-apk/app-release.apk NeuroSense.apk
          ls -lh NeuroSense.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NeuroSense-apk
          path: mobile/NeuroSense.apk
          retention-days: 14
