# Builds an unsigned iOS .ipa of the demo app for sideloading (SideStore / AltStore).
# SideStore signs it with your own Apple ID when you install it.
#
# Run it from GitHub: Actions → "iOS demo build (.ipa)" → Run workflow.
# Download: open the finished run → Artifacts → NeuroSense-ipa.
#
# macOS minutes are expensive on private repos, so this only runs when started by hand
# or when a tag like v0.1 is pushed. Tests run on cheap Linux on every push (tests.yml).
name: iOS demo build (.ipa)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Server address, e.g. http://192.168.1.178:8000/api/v1. Empty = demo data build.'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get

      # With a server address the app talks to that server; without one it is the demo-data build.
      - name: Build iOS app (no code signing)
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            flutter build ios --release --no-codesign --dart-define=USE_FIXTURES=false --dart-define=API_BASE_URL="$API_BASE_URL"
          else
            flutter build ios --release --no-codesign --dart-define=USE_FIXTURES=true
          fi

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr NeuroSense.ipa Payload
          ls -lh NeuroSense.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NeuroSense-ipa
          path: mobile/NeuroSense.ipa
          retention-days: 14
