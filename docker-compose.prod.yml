# Cloud server only, on top of docker-compose.yml. See docs/backend.md, "Cloud deployment".
#   docker compose --env-file backend/.env -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Only Caddy (HTTPS) is reachable from the internet; the API and database are not.
services:
  db:
    restart: unless-stopped
    ports: !reset []

  api:
    restart: unless-stopped
    ports: !reset []
    volumes: !override
      - ./backend/models:/srv/models:ro

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in backend/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data # the HTTPS certificate

volumes:
  caddydata:
